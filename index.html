        /* CSS Reset & Variables */
        :root {
            --primary-color: #0066ff;
            --primary-dark: #0052d4;
            --secondary-color: #6c5ce7;
            --accent-color: #00d2d3;
            --white: #ffffff;

        html {

            background-color: var(--light-bg);

            margin: 0 auto;

        section {

            line-height: 1.2;
            margin-bottom: 20px;

            padding-bottom: 15px;
        }
